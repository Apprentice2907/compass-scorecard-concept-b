<style>

  }
  * { box-sizing: border-box; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 24px; padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); background: var(--white); }
  .brand { font-weight: 800; letter-spacing: .12em; font-size: 14px; }
  .brand small { display: block; font-weight: 500; letter-spacing: .02em; color: var(--muted); font-size: 12px; }
  .proto { font-size: 12px; color: var(--muted); text-align: right; }

  /* default: side by side (landscape tablet / laptop) */
  .wrap { max-width: 1360px; margin: 0 auto; padding: 20px 24px 40px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .scene-col { position: sticky; top: 14px; }
  .scene { background: var(--scene); border: 1px solid var(--line); border-radius: 24px; padding: 6px; overflow: hidden; }
  .stage-box { position: relative; }
  .stage-box svg { display: block; width: 100%; height: min(68vh, 600px); }
  #future { position: absolute; inset: 0; clip-path: inset(0 0 0 50%); }
  .divider { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--white); box-shadow: 0 0 0 1px rgba(0,0,0,.15); pointer-events: none; }
  .divider::after { content: '‹ ›'; letter-spacing: 2px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 18px; }
  .cmp-label { position: absolute; top: 10px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: rgba(255,255,255,.92); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; pointer-events: none; }
  .cmp-label.l { left: 10px; } .cmp-label.r { right: 10px; background: var(--ink); color: #fff; border-color: var(--ink); }
  .cmp-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; touch-action: none; }
  .compare-ui[hidden] { display: none !important; }
  .caption { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 10px 4px; font-size: 14px; color: var(--muted); min-height: 34px; flex-wrap: wrap; }
  .caption b { color: var(--ink); }
  .built { display: flex; gap: 10px; }
  .built span { display: flex; gap: 4px; }
  .built i { width: 16px; height: 6px; border-radius: 3px; background: var(--line); transition: background .4s var(--ease); }
  .built i.on { background: var(--ink); }
  .built i.now { background: var(--gold); }
  .legend { display: flex; gap: 12px; font-size: 12.5px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 24px; padding: 30px; min-height: 420px; }
  .screen > * { animation: rise .45s var(--ease) both; }
  .screen > *:nth-child(2) { animation-delay: .05s; } .screen > *:nth-child(3) { animation-delay: .1s; }
  .screen > *:nth-child(4) { animation-delay: .15s; } .screen > *:nth-child(5) { animation-delay: .2s; } .screen > *:nth-child(n+6) { animation-delay: .25s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-deep); margin: 0 0 8px; }
  h1 { font-size: clamp(28px, 3.4vw, 42px); line-height: 1.08; margin: 0 0 12px; letter-spacing: -.02em; }
  h2 { font-size: clamp(21px, 2.2vw, 26px); line-height: 1.25; margin: 0 0 18px; letter-spacing: -.01em; outline: none; }
  .lead { font-size: 17px; color: #333; margin: 0 0 18px; }
  .why-h { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 0 10px; }
  .why { list-style: none; padding: 0; margin: 0 0 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .wcard { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 16px; overflow: hidden; background: #D9CFC2; isolation: isolate; }
  .wcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kb 9s ease-out both; }
  .wcard:nth-child(2) img { animation-delay: .3s; } .wcard:nth-child(3) img { animation-delay: .6s; }
  @keyframes kb { from { transform: scale(1.1); } to { transform: scale(1); } }
  .wcard::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(12,9,6,.86) 0%, rgba(12,9,6,.5) 38%, rgba(12,9,6,0) 66%); }
  .wcard .tag { position: absolute; top: 10px; left: 10px; z-index: 1; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: rgba(255,255,255,.94); color: var(--ink); padding: 4px 8px; border-radius: 999px; }
  .wcard .txt { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 14px 13px; color: #fff; }
  h1:focus { outline: none; }

  /* why option 1: pillar tour linked to the scene */
  .tour { border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; margin: 0 0 20px; }
  .tour-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tour-tabs button { position: relative; font: inherit; font-size: 13px; font-weight: 700; line-height: 1.2; padding: 13px 8px; border: 0; border-bottom: 1.5px solid var(--line); background: #FAF6EE; color: var(--muted); cursor: pointer; }
  .tour-tabs button + button { border-left: 1px solid var(--line); }
  .tour-tabs button[aria-selected="true"] { background: var(--white); color: var(--ink); border-bottom-color: transparent; }
  .tour-tabs button i { position: absolute; left: 0; bottom: -1.5px; height: 3px; width: 0; background: var(--gold); }
  .tour-tabs button[aria-selected="true"] i { animation: fillbar var(--dur, 4.5s) linear forwards; }
  @keyframes fillbar { to { width: 100%; } }
  .tour-body { padding: 18px 20px 20px; }
  .tour-body .k { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); }
  .tour-body b { display: block; font-size: clamp(24px, 2.6vw, 31px); line-height: 1.12; margin: 6px 0 8px; letter-spacing: -.015em; text-wrap: balance; }
  .tour-body p { margin: 0; color: #444; font-size: 16px; }
  .tour-body .qs { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
  .tour-body.swap > * { animation: rise .4s var(--ease) both; }

  /* why option 2: attract loop shown while the tablet is idle */
  .attract { position: fixed; inset: 0; z-index: 50; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; text-align: left; font: inherit; color: #fff; border: 0; cursor: pointer;
    padding: 28px max(28px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
    background: linear-gradient(to bottom, rgba(20,17,14,0) 34%, rgba(20,17,14,.86) 56%, #14110E 100%); }
  .attract .eb { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #E2CC95; }
  .attract .big { font-size: clamp(40px, 6.6vw, 76px); line-height: 1.02; font-weight: 800; letter-spacing: -.025em; margin: 12px 0 12px; max-width: 14ch; min-height: 2.05em; }
  .attract .sub { font-size: clamp(17px, 2.1vw, 22px); color: rgba(255,255,255,.84); max-width: 34ch; margin: 0 0 28px; min-height: 2.6em; }
  .attract .swap { animation: rise .55s var(--ease) both; }
  .attract .cta { display: inline-flex; align-items: center; gap: 12px; background: var(--gold); color: #111; font-weight: 800; font-size: clamp(17px, 2vw, 20px); padding: 19px 28px; border-radius: 999px; animation: pulse 2.2s ease-in-out infinite; }
  .attract .dots { display: flex; gap: 6px; margin-top: 22px; }
  .attract .dots i { width: 26px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); transition: background .3s; }
  .attract .dots i.on { background: #E2CC95; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .wcard b { display: block; font-size: 15.5px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
  .wcard .txt span { display: block; margin-top: 5px; font-size: 12px; line-height: 1.35; color: rgba(255,255,255,.88); }
  .wcard { aspect-ratio: 3 / 4.4; }
  .wcard::after { background: linear-gradient(to top, rgba(12,9,6,.9) 0%, rgba(12,9,6,.62) 45%, rgba(12,9,6,0) 75%); }
  @media (orientation: portrait), (max-width: 900px) {
    .wcard { aspect-ratio: 3 / 4; }
    .wcard b { font-size: 18px; }
    .wcard .txt span { font-size: 13px; }
    .wcard::after { background: linear-gradient(to top, rgba(12,9,6,.86) 0%, rgba(12,9,6,.5) 38%, rgba(12,9,6,0) 66%); }
  }
  .btn { appearance: none; border: 0; background: var(--ink); color: var(--white); font-family: inherit; font-weight: 600; font-size: 17px; line-height: 1; padding: 18px 28px; border-radius: 999px; cursor: pointer; transition: transform .2s var(--ease), background .2s; }
  .btn:hover { background: #333; } .btn:active { transform: scale(.97); }
  .btn:focus-visible, .opt:focus-visible, .more:focus-visible, .link:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .link { background: none; border: 0; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px 0; }
  form { display: grid; gap: 13px; }
  label { font-size: 14px; font-weight: 600; display: grid; gap: 6px; }
  label .opt-tag { font-weight: 400; color: var(--muted); }
  input, select, textarea { font: inherit; font-size: 17px; padding: 13px 15px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); width: 100%; color: var(--ink); }
  textarea { min-height: 84px; resize: vertical; font-size: 15px; }
  .note { font-size: 13px; color: var(--muted); margin: 0; }
  .meta-line { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; }

  .qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .count { font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .pillar-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--gold-deep); background: #F6F0E4; border-radius: 999px; padding: 5px 12px; margin-bottom: 12px; }
  .opts { display: grid; gap: 10px; }
  .orow { display: grid; grid-template-columns: 1fr auto; border: 1.5px solid var(--line); border-radius: 16px; background: var(--white); transition: border-color .2s, transform .25s var(--ease), box-shadow .25s; animation: rise .4s var(--ease) both; overflow: hidden; }
  .orow:hover { border-color: var(--gold); }
  .orow.picked { border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }
  .opt { position: relative; text-align: left; font: inherit; font-size: 18px; font-weight: 700; line-height: 1.25; color: var(--ink); background: none; border: 0; padding: 18px 16px 18px 52px; cursor: pointer; min-height: 62px; }
  .tick { position: absolute; left: 16px; top: 50%; margin-top: -13px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); transition: background .2s, border-color .2s; }
  .orow.picked .tick { background: var(--ink); border-color: var(--ink); }
  .tick path { stroke: #fff; stroke-width: 2.4; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; }
  .orow.picked .tick path { transition: stroke-dashoffset .3s .05s var(--ease); stroke-dashoffset: 0; }
  .more { font: inherit; font-size: 13px; font-weight: 600; color: var(--gold-deep); background: #FAF6EE; border: 0; border-left: 1px solid var(--line); padding: 0 16px; cursor: pointer; min-width: 84px; }
  .more[aria-expanded="true"] { background: #F1E8D6; }
  .detail { grid-column: 1 / -1; margin: 0; padding: 0 16px 14px 52px; font-size: 15px; color: #444; }
  .tip { font-size: 13px; color: var(--muted); margin: 12px 0 0; }

  .score { display: flex; align-items: baseline; gap: 8px; margin: 0; }
  .score b { font-size: clamp(56px, 6.5vw, 80px); line-height: 1; letter-spacing: -.04em; }
  .score span { font-size: 24px; color: var(--muted); }
  .stage-name { display: inline-block; font-size: 22px; margin: 6px 0 14px; padding: 6px 14px; border-radius: 10px; color: #fff; background: var(--stage, var(--ink)); }
  .ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 0 0 16px; }
  .rung { font-size: 11px; font-weight: 600; color: var(--muted); }
  .rung i { display: block; height: 8px; border-radius: 4px; background: var(--line); margin-bottom: 6px; transition: background .4s var(--ease); }
  .rung.reached i { background: var(--gold); }
  .rung.here { color: var(--ink); } .rung.here i { background: var(--stage, var(--ink)); }
  .desc { font-size: 16px; margin: 0 0 14px; }
  .pcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 14px; }
  .pcard { border-radius: 14px; padding: 12px; border: 1.5px solid; min-width: 0; }
  .pcard small { display: block; font-size: 12px; font-weight: 700; line-height: 1.25; min-height: 30px; }
  .pcard b { display: block; font-size: 26px; line-height: 1.1; }
  .pcard b span { font-size: 14px; color: var(--muted); font-weight: 600; }
  .pcard em { font-style: normal; font-size: 12.5px; font-weight: 700; }
  .pcard.low { border-color: var(--low); background: #FBEDEB; } .pcard.low em { color: var(--low); }
  .pcard.mid { border-color: var(--mid); background: #FDF3E3; } .pcard.mid em { color: #9A5F07; }
  .pcard.strong { border-color: var(--strong); background: #ECF4EA; } .pcard.strong em { color: var(--strong); }
  .gaps { font-size: 16px; font-weight: 600; margin: 0 0 14px; }
  .sent { display: flex; gap: 10px; align-items: flex-start; background: #F6F0E4; border-radius: 14px; padding: 12px 14px; font-size: 14.5px; margin: 0 0 14px; }
  details { margin-top: 12px; font-size: 14px; color: var(--muted); }
  details summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 6px 0; }
  details form { margin-top: 8px; }
  pre { white-space: pre-wrap; background: #FAF8F5; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 12px; max-height: 240px; overflow: auto; }
  .next-guest { display: block; margin-top: 16px; }

  /* ---------- scene ---------- */
  .item .sk, .item .rl { opacity: 0; transition: opacity .55s ease; }
  .item.sketch .sk { opacity: 1; animation: drop .6s cubic-bezier(.34,1.4,.64,1) both; }
  .item.real .rl { opacity: 1; }
  .item.real .sk { opacity: 0; }
  .rl .v1, .rl .v3, .rl .v5 { display: none; }
  .item.l1 .v1, .item.l3 .v3, .item.l5 .v5 { display: inline; }
  @keyframes drop { from { opacity: 0; transform: translateY(-34px); } to { opacity: 1; transform: none; } }
  .slot { fill: rgba(179,152,90,.07); stroke: #B8AC9C; stroke-width: 1.2; stroke-dasharray: 4 4; transition: opacity .4s; }
  .slot.filled { opacity: 0; }
  .slot.current { stroke: var(--gold-deep); stroke-width: 2.2; fill: rgba(179,152,90,.18); animation: march 1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -16; } }
  .pin { transition: opacity .35s; }

  .pin text { font: 700 9.5px 'Hanken Grotesk', sans-serif; fill: var(--muted); }
  .pin.current .dot { fill: var(--gold); stroke: var(--gold-deep); }
  .pin.current text, .pin.done text, .pin.lv text { fill: #fff; }
  .pin.current { animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .pin.done .dot { fill: #8A9BB0; stroke: #8A9BB0; }
  .pin.lv1 .dot { fill: var(--low); stroke: #fff; } .pin.lv3 .dot { fill: var(--mid); stroke: #fff; } .pin.lv5 .dot { fill: var(--strong); stroke: #fff; }
  .pin.hide { opacity: 0; }
  .crowd { opacity: 0; transition: opacity .5s ease; }
  .crowd.on { opacity: 1; }
  .chip rect { fill: #fff; stroke: var(--gold); stroke-width: 1.2; }
  .chip text { font-family: 'Hanken Grotesk', sans-serif; }
  .chip .n { font-size: 7px; font-weight: 800; letter-spacing: .12em; fill: var(--gold-deep); }
  .chip .t { font-size: 9px; font-weight: 800; fill: #111; }
  .chip.dim { opacity: .55; } .chip.active rect { fill: #111; stroke: #111; } .chip.active .t { fill: #fff; } .chip.active .n { fill: #E9D7AE; }
  .chip.done rect { stroke: var(--ink); }

  @keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  .sign-text { font: 800 7.4px 'Hanken Grotesk', sans-serif; letter-spacing: .14em; fill: #fff; }

  /* stacked: phones and portrait tablets (the event set-up) */
  @media (orientation: portrait), (max-width: 900px) {

<body>
<header class="top">
  <div class="brand">COMPASS GROUP<small>Dining Readiness Index</small></div>
  <div class="proto">Prototype · placeholder branding and name · nothing is stored</div>
</header>
<main class="wrap">
  <div class="scene-col">
    <div class="scene">
      <div class="stage-box" id="stageBox">
        <svg id="today" role="img" aria-label="Illustrated cafeteria that builds as you answer"></svg>
        <div class="compare-ui" id="compareUI" hidden>
          <svg id="future" aria-hidden="true"></svg>
          <div class="divider" id="divider" style="left:50%"></div>
          <span class="cmp-label l">Today</span><span class="cmp-label r">Future-ready</span>
          <input class="cmp-range" id="cmpRange" type="range" min="0" max="100" value="50" aria-label="Drag to compare your cafeteria today with a future-ready cafeteria">
        </div>
      </div>
      <div class="caption"><span id="caption"></span><span id="capRight"></span></div>
    </div>
  </div>
  <section class="panel"><div id="screen" class="screen" aria-live="polite"></div></section>
</main>
<script src="quiz-data.js"></script>
<script>
(function () {
  const Q = window.QUIZ;
  const N = Q.questions.length;
  const RM = Q.reducedMotion();
  // which "why invest" treatment to show: ?why=1 pillar tour, ?why=2 attract loop, default photo cards
  const WHY_MODE = new URLSearchParams(location.search).get('why') || '3';
  const answers = new Array(N).fill(null);
  let role = '', variant = 'k12', lead = null, busy = false, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, RM ? Math.min(ms, 150) : ms));
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

  /* ================= isometric drawing kit ================= */

      v3: V => box(3.45, 7.95, .9, 1.6, .05, .75, '#fff') + onFront(3.45, 8.0, 1.6, `<rect x="2" y="2" width="16" height="13" fill="#F3EFE6"/><path d="M4 6 h11 M4 10 h8" stroke="#BDB6AA" stroke-width="1.1"/>` + T(21, 7, 'TELL US', 4.4, C.blue, 800) + `<g fill="#E9C46A"><circle cx="23" cy="12" r="1.6"/><circle cx="27" cy="12" r="1.6"/><circle cx="31" cy="12" r="1.6"/></g>`) +
        box(5.25, 7.7, 0, .45, .45, .8, C.blue) + poly([P(5.33, 7.92, .8), P(5.62, 7.92, .8), P(5.62, 7.95, .8), P(5.33, 7.95, .8)], C.dark),
      v5: V => box(3.4, 7.95, .7, 1.7, .06, 1.15, C.screen) + onFront(3.4, 8.01, 1.8, `<rect width="41" height="26" fill="${C.screen}"/>` + T(3, 6.5, 'YOU SAID', 4, '#F6D365', 800) + T(23, 6.5, 'WE DID', 4, C.leaf, 800) +
        `<path d="M3 11 h15 M3 15 h12 M3 19 h14 M23 11 h14 M23 15 h11 M23 19 h13" stroke="#C9D3D8" stroke-width="1.1"/><path d="M20.5 9 v13" stroke="#5B6A72" stroke-width=".6"/>`) +
        person(3.9, 8.85, { kid: V !== 'uni', c: '#B3985A', s: 2 }) + person(4.8, 8.95, { c: '#7A3B2E', s: 1 })

  /* ================= people who fill the cafeteria ================= */
  function crowdSpots(V) {
    const kid = V !== 'uni';
    const look = (n, extra = {}) => Object.assign({ kid, c: ['#3F6E9A', '#B3985A', '#6E8B3D', '#8E2C48', '#E0A93B', '#4C5B8A'][n % 6], s: n % 5 }, extra, V === 'uni' && !extra.seated ? { bag: ['#2E2B28', '#7A3B2E', '#3F6E9A'][n % 3] } : {});
    // [x, y, options], in the order they arrive
    const queue = [[4.4, 2.55], [5.3, 2.6], [6.2, 2.5], [7.2, 2.6]].map(([x, y], n) => [x, y, look(n + 1)]);
    const seats = V === 'uni'
      ? [[4.45, 3.45], [6.75, 3.45], [4.45, 5.65], [6.75, 5.65]].map(([x, y], n) => [x, y, look(n + 3, { seated: true })])
      : [[4.4, 3.2], [5.7, 3.2], [7.0, 3.2], [4.4, 5.4], [5.7, 5.4], [7.0, 5.4]].map(([x, y], n) => [x, y, look(n + 2, { seated: true })]);
    const stand = V === 'uni' ? [[8.2, 4.4, look(5)], [8.55, 4.9, look(2)]] : [];
    const all = [];
    const order = [seats[0], queue[0], seats[1], queue[1], seats[2], stand[0], queue[2], seats[3], stand[1], seats[4], queue[3], seats[5]].filter(Boolean);
    order.forEach((p, n) => all.push({ x: p[0], y: p[1], o: p[2], n }));
    return all;
  }

  function dining(V, crowd) {
    // tables, with seated people interleaved so nearer things draw on top
    const seated = crowd.filter(p => p.o.seated);
    const pp = p => `<g class="crowd" data-n="${p.n}">${person(p.x, p.y, p.o)}</g>`;
    let s = '';
    if (V === 'uni') {
      for (const [tx, ty] of [[4.0, 3.75], [6.3, 3.75], [4.0, 5.95], [6.3, 5.95]]) {
        s += box(tx + .3, ty - .55, 0, .4, .4, .42, C.woodD) + box(tx + .3, ty - .6, .42, .4, .08, .55, C.woodD);
        seated.filter(p => Math.abs(p.y - (ty - .3)) < .01 && Math.abs(p.x - (tx + .45)) < .01).forEach(p => s += pp(p));
        s += box(tx + .42, ty + .3, 0, .12, .12, .7, C.steelD) + box(tx, ty, .7, .95, .95, .06, C.woodL);
        const [a, b] = P(tx + .4, ty + .45, .76); s += `<path d="M${a - 5} ${b} l7 3.5 l0 -6 l-7 -3.5z" fill="#3A3F44"/><path d="M${a - 5} ${b} l7 3.5 l6 -3 l-7 -3.5z" fill="#9AA3A8"/>`;
        const [c, d] = P(tx + .7, ty + .3, .76); s += `<ellipse cx="${c}" cy="${d}" rx="3" ry="1.6" fill="#fff"/><ellipse cx="${c}" cy="${d - .3}" rx="2" ry="1" fill="#6B4226"/>`;
      }
    } else {
      for (const ty of [3.5, 5.7]) {
        s += box(3.7, ty - .55, 0, 3.8, .34, .42, C.woodD);
        seated.filter(p => Math.abs(p.y - (ty - .3)) < .01).forEach(p => s += pp(p));
        s += box(3.7, ty, 0, 3.8, .95, .74, C.woodL);
        [4.4, 5.7, 7.0].forEach(px => { const [a, b] = P(px, ty + .4, .74); s += `<ellipse cx="${a}" cy="${b}" rx="6.5" ry="3.4" fill="#fff" stroke="#D9D2C6" stroke-width=".5"/><ellipse cx="${a - 1.6}" cy="${b - .2}" rx="2.2" ry="1.2" fill="${C.carrot}"/><ellipse cx="${a + 1.8}" cy="${b + .3}" rx="2" ry="1" fill="${C.green}"/>`; });
        s += box(3.7, ty + 1.15, 0, 3.8, .34, .42, C.woodD);
      }
    }
    return s;
  }

  /* ================= areas (pillars) ================= */
  const AREAS = [
    { floor: floorPoly(3.0, 0, 9.2, 2.45), box: [2.9, 0, 12.4, 3.0, 4.9], chip: [2.1, 0, 4.75], label: 'Serving counter' },
    { floor: floorPoly(0, 0, 2.7, 9), box: [0, 0, 2.9, 9.1, 4.9], chip: [0, 6.0, 4.75], label: 'Kitchen' },
    { floor: floorPoly(3.0, 2.6, 9.4, 6.4), box: [2.9, 2.5, 12.6, 9.2, 2.4], chip: [6.7, 8.9, 0], label: 'Dining hall' }
  ];
  function bboxOf(x0, y0, x1, y1, zt, pad = 14) {
    const ps = []; for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [0, zt]) ps.push(P(x, y, z));
    const xs = ps.map(p => p[0]), ys = ps.map(p => p[1]);
    return [Math.min(...xs) - pad, Math.min(...ys) - pad - 10, Math.max(...xs) - Math.min(...xs) + pad * 2, Math.max(...ys) - Math.min(...ys) + pad * 2 + 10];
  }
  const FULL = bboxOf(-0.4, -0.4, 12.6, 9.2, 5.2, 8);

  /* ================= scene builder (used twice: today + future) ================= */
  function makeScene(svg, id) {
    let V = 'k12', crowd = [], vb = FULL.slice(), anim = 0, signName = '';
    const el = {};
    function render(variant) {
      V = variant; crowd = crowdSpots(V);
      const pp = p => `<g class="crowd" data-n="${p.n}">${person(p.x, p.y, p.o)}</g>`;
      const item = i => `<g class="item" data-i="${i}"><g class="sk" filter="url(#bp${id})">${ITEMS[i].common(V)}</g><g class="rl">${ITEMS[i].common(V)}<g class="v1">${ITEMS[i].v1(V)}</g><g class="v3">${ITEMS[i].v3(V)}</g><g class="v5">${ITEMS[i].v5(V)}</g></g></g>`;
      let s = `<defs>
        <filter id="bp${id}" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".105 .2065 .0385 0 .45  .12 .236 .044 0 .5  .135 .2655 .0495 0 .58  0 0 0 .8 0"/></filter>
        <filter id="pale${id}" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".3593 .4004 .0403 0 .16  .1193 .6404 .0403 0 .16  .1193 .4004 .2803 0 .16  0 0 0 1 0"/></filter>
      </defs>`;
      // floor + walls
      for (let x = 0; x < 12; x++) for (let y = 0; y < 9; y++) s += poly(floorPoly(x, y, 1, 1), (x + y) % 2 ? '#E4D9CA' : '#EBE2D5', 'stroke="#DCCFBE" stroke-width=".5"');
      s += box(0, -0.3, 0, 12.4, 0.3, 5, C.wall) + box(-0.3, -0.3, 0, 0.3, 9.3, 5, C.wallL) + poly(leftPoly(0, -0.3, 9.3, 0, 5), '#E6DDD0', EDGE);
      s += poly(wallPoly(0, 0, 12.4, 0, .32), C.gold) + poly(leftPoly(0, 0, 9, 0, .32), shade(C.gold, -.12));
      s += poly(wallPoly(10.6, .01, 1.5, 1.6, 2.2), '#CFDDE3', EDGE) + poly(wallPoly(11.33, .02, .05, 1.6, 2.2), '#fff');
      // institution sign
      s += box(6.85, 0, 4.2, 4.6, 0.08, 0.6, C.dark) + onFront(6.92, .09, 4.74, `<text class="sign-text" x="55" y="9.2" text-anchor="middle">YOUR INSTITUTION</text>`);
      // pillar flash highlights (under the furniture)
      s += AREAS.map((a, p) => `<g class="flash fl" data-p="${p}"><polygon points="${pts(a.floor)}"/></g>`).join('');
      s += `<g class="slots">${ITEMS.map((it, i) => `<polygon class="slot" data-i="${i}" points="${pts(it.slot)}"/>`).join('')}</g>`;
      // painter's order, back to front
      s += item(0) + item(1) + item(2);
      s += crowd.filter(p => !p.o.seated && p.y < 3).map(pp).join('');
      s += item(3) + item(4) + item(5);
      s += dining(V, crowd);
      s += crowd.filter(p => !p.o.seated && p.y >= 3).map(pp).join('');
      s += item(8) + item(7) + item(6);
      // area chips + flash banners + pins on top
      s += AREAS.map((a, p) => { const [x, y] = P(...a.chip); const t = Q.pillars[p].name.toUpperCase(), w = Math.max(t.length * 5.9, (a.label.length + 4) * 5.3) + 16;
        return `<g class="chip" data-p="${p}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="${-w / 2}" y="-13" width="${w}" height="25" rx="6"/><text class="n" text-anchor="middle" y="-3.5">${p + 1} · ${a.label.toUpperCase()}</text><text class="t" text-anchor="middle" y="7">${t}</text></g>`; }).join('');
      s += AREAS.map((a, p) => { const c = a.floor.reduce((m, q) => [m[0] + q[0] / 4, m[1] + q[1] / 4], [0, 0]); const t = Q.pillars[p].name + ' done ✓', w = t.length * 6.4 + 20;
        return `<g class="flash" data-p="${p}"><rect x="${c[0] - w / 2}" y="${c[1] - 14}" width="${w}" height="24" rx="12"/><text x="${c[0]}" y="${c[1] + 2}" text-anchor="middle">${t}</text></g>`; }).join('');
      s += `<g class="pins">${ITEMS.map((it, i) => { const [x, y] = P(...it.pin); return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="pin" data-i="${i}"><path d="M0 9 l-4 -6 h8z" fill="#B8AC9C"/><circle class="dot" r="8.5" cy="-1"/><text text-anchor="middle" y="2.4">${i + 1}</text></g></g>`; }).join('')}</g>`;
      svg.innerHTML = s;
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      // items are drawn in painter's order, so index them by question number, not DOM order
      el.items = [...svg.querySelectorAll('.item')].sort((a, b) => a.dataset.i - b.dataset.i);
      el.slots = [...svg.querySelectorAll('.slot')];
      el.pins = [...svg.querySelectorAll('.pin')];
      el.crowd = [...svg.querySelectorAll('.crowd')];
      el.chips = [...svg.querySelectorAll('.chip')];
      el.sign = svg.querySelector('.sign-text');
      setSign(signName);
      setVB(vb);
    }
    function setVB(b) { vb = b.slice(); svg.setAttribute('viewBox', vb.map(n => n.toFixed(1)).join(' ')); }
    function zoom(target) {
      cancelAnimationFrame(anim);
      const from = vb.slice(), t0 = performance.now(), dur = RM ? 0 : 700;
      const step = now => { const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        setVB(from.map((v, n) => v + (target[n] - v) * e)); if (k < 1) anim = requestAnimationFrame(step); };
      anim = requestAnimationFrame(step);
    }
    function setSign(name) {
      signName = name || '';
      if (!el.sign) return;
      const t = (signName || 'Your institution').toUpperCase() + (V === 'uni' ? ' · FOOD COURT' : ' · DINING HALL');
      el.sign.textContent = t;
      if (t.length > 24) { el.sign.setAttribute('textLength', 100); el.sign.setAttribute('lengthAdjust', 'spacingAndGlyphs'); } else el.sign.removeAttribute('textLength');
    }
    function setItem(i, state, L) {
      const it = el.items[i];
      it.classList.remove('sketch', 'real', 'l1', 'l3', 'l5');
      const rl = it.querySelector('.rl');
      rl.removeAttribute('filter');
      if (state === 'sketch') it.classList.add('sketch');
      if (state === 'real') { it.classList.add('real', 'l' + L); if (L === 1) rl.setAttribute('filter', `url(#pale${id})`); }
    }
    function setCrowd(n) { el.crowd.forEach(c => c.classList.toggle('on', +c.dataset.n < n)); }
    const crowdSize = () => crowd.length;
    function quiz(ans, current) {
      ITEMS.forEach((_, i) => {
        const done = !!ans[i];
        setItem(i, done ? 'sketch' : 'none');
        el.slots[i].classList.toggle('filled', done && i !== current);
        el.slots[i].classList.toggle('current', i === current);
        el.slots[i].style.display = '';
        const pin = el.pins[i]; pin.setAttribute('class', 'pin' + (i === current ? ' current' : done ? ' done' : ''));
      });
      const answered = ans.filter(Boolean).length;
      setCrowd(Math.round(answered / N * crowd.length));
      const p = current >= 0 ? Q.questions[current].pillar : -1;
      el.chips.forEach((c, n) => { c.setAttribute('class', 'chip' + (p === -1 ? '' : n === p ? ' active' : Q.pillars[n].q.every(q => ans[q]) ? ' done' : ' dim')); });
    }
    function reveal(levelOf, stagger, pinsToo = true) {
      el.slots.forEach(s => s.style.display = 'none');
      el.chips.forEach(c => c.setAttribute('class', 'chip'));
      ITEMS.forEach((_, i) => {
        const L = levelOf(i);
        const go = () => { setItem(i, 'real', L); if (pinsToo) el.pins[i].setAttribute('class', 'pin lv lv' + L); else el.pins[i].setAttribute('class', 'pin hide'); };
        stagger && !RM ? later(go, i * stagger) : go();
      });
      setCrowd(crowd.length);
    }
    function flash(p) {
      svg.querySelectorAll(`.flash[data-p="${p}"]`).forEach(f => { f.classList.remove('go'); void f.getBBox(); f.classList.add('go'); });
    }
    const areaBox = p => { const b = AREAS[p].box; return bboxOf(b[0], b[1], b[2], b[3], b[4]); };
    function chip(p) {
      el.chips.forEach((c, n) => c.setAttribute('class', 'chip' + (p < 0 ? '' : n === p ? ' active' : ' dim')));
      svg.querySelectorAll('.flash.fl').forEach(f => f.classList.toggle('hold', +f.dataset.p === p));
    }
    return { render, quiz, reveal, flash, zoom, setVB, setSign, areaBox, setCrowd, crowdSize, chip, get variant() { return V; } };
  }

  /* ================= wiring ================= */
  const today = makeScene(document.getElementById('today'), 'T');
  const future = makeScene(document.getElementById('future'), 'F');
  today.render('k12');
  const screen = document.getElementById('screen');
  const caption = document.getElementById('caption');
  const capRight = document.getElementById('capRight');
  const compareUI = document.getElementById('compareUI');
  const cmpRange = document.getElementById('cmpRange');
  const divider = document.getElementById('divider');
  const futureSvg = document.getElementById('future');
  cmpRange.addEventListener('input', () => { const v = cmpRange.value; futureSvg.style.clipPath = `inset(0 0 0 ${v}%)`; divider.style.left = v + '%'; });

  const h = (tag, props = {}, kids = []) => { const e = document.createElement(tag); Object.assign(e, props); kids.forEach(k => e.append(k)); return e; };
  function show(nodes) {
    screen.replaceChildren(...nodes);
    const head = screen.querySelector('h1, h2');
    if (head) { head.tabIndex = -1; head.focus({ preventScroll: true }); }
    const panelTop = screen.getBoundingClientRect().top + window.scrollY - 12;
    if (window.scrollY > panelTop) window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' });
  }
  const setCaption = (lead, rest) => { caption.replaceChildren(); if (lead) caption.append(h('b', { textContent: lead })); if (rest) caption.append(' ' + rest); };
  function progress(current) {
    const wrap = h('span', { className: 'built', ariaHidden: 'true' });
    Q.pillars.forEach(p => wrap.append(h('span', {}, p.q.map(i => h('i', { className: i === current ? 'now' : answers[i] ? 'on' : '' })))));
    capRight.replaceChildren(wrap);
  }
  function legend() {
    capRight.replaceChildren(h('span', { className: 'legend' }, [['--strong', 'Strong'], ['--mid', 'In progress'], ['--low', 'Needs attention']].map(([v, t]) => { const i = h('i'); i.style.background = `var(${v})`; return h('span', {}, [i, t]); })));
  }

  const ROLES = [
    ['K-12', ['Principal', 'Director / Trustee', 'School administrator', 'Facilities / Operations head']],
    ['Higher education', ['Vice Chancellor / Director', 'Dean', 'Registrar', 'Campus services / Dining head']]
  ];
  const variantFor = r => (ROLES[1][1].includes(r) ? 'uni' : 'k12');

  /* ================= screens ================= */
  function intro() {
    clearTimers();
    compareUI.hidden = true;
    today.render(variantFor(role));
    today.quiz(answers, -1);
    today.zoom(FULL);
    setCaption('Your cafeteria', 'builds as you answer: 3 areas, 9 questions.');
    progress(-1);
    const f = h('form');
    const rIn = h('select', { required: true });
    rIn.append(h('option', { value: '', textContent: 'Select your role' }));
    ROLES.forEach(([g, list]) => { const og = h('optgroup', { label: g }); list.forEach(r => og.append(h('option', { value: r, textContent: r, selected: r === role }))); rIn.append(og); });
    rIn.append(h('option', { value: 'Other', textContent: 'Other', selected: role === 'Other' }));
    rIn.onchange = () => { role = rIn.value; const v = variantFor(role); if (v !== today.variant) { today.render(v); today.quiz(answers, -1); } };
    f.append(
      h('label', {}, ['Your role', rIn]),
      h('div', {}, [h('button', { className: 'btn', type: 'submit', textContent: 'Start' })]),
      h('p', { className: 'note', textContent: '9 quick questions · about 60 seconds · no right or wrong answers' })
    );
    f.onsubmit = e => { e.preventDefault(); if (!f.reportValidity()) return; role = rIn.value; question(0); };
    const WHY = [
      { img: 'img/why-learn.jpg', uni: 'img/why-campus.jpg', tag: 'Nutrition', b: 'Well-fed students learn better', t: 'Good meals help students focus and keep their energy up all day.', alt: 'Students eating lunch together in a dining hall' },
      { img: 'img/why-safe.jpg', tag: 'Food Safety', b: 'Safe food protects your name', t: 'A well-run kitchen lowers risk and builds trust.', alt: 'Chefs in white uniforms reviewing a menu' },
      { img: 'img/why-families.jpg', tag: 'Awareness', b: 'Families notice what you serve', t: 'Food is one of the first things people judge you on.', alt: 'Fresh salads and vegetables at a serving counter' }
    ];
    const cardImgs = [];
    const why = h('ul', { className: 'why', ariaLabel: 'Why invest in good food' }, WHY.map(w => {
      const img = h('img', { src: variantFor(role) === 'uni' && w.uni ? w.uni : w.img, alt: w.alt, loading: 'eager', decoding: 'async' });
      cardImgs.push([img, w]);
      return h('li', { className: 'wcard' }, [img, h('span', { className: 'tag', textContent: w.tag }), h('span', { className: 'txt' }, [h('b', { textContent: w.b }), h('span', { textContent: w.t })])]);
    }));
    rIn.addEventListener('change', () => cardImgs.forEach(([img, w]) => { if (w.uni) img.src = variantFor(rIn.value) === 'uni' ? w.uni : w.img; }));
    const whyBlock = WHY_MODE === '1' ? [h('p', { className: 'why-h', textContent: 'Why invest in good food' }), tour()]
      : WHY_MODE === '2' ? [h('p', { className: 'lead', textContent: 'Answer 9 quick questions and see your cafeteria built, one area at a time.' })]
      : [h('p', { className: 'why-h', textContent: 'Why invest in good food' }), why];
    show([
      h('p', { className: 'eyebrow', textContent: 'Dining Readiness Index' }),
      h('h1', { textContent: 'How future-ready is your institution’s dining?' }),
      ...whyBlock,
      f
    ]);
    onIntro = true;
  }

  /* why option 1: one reason per pillar; the scene zooms to that area */
  const REASONS = [
    { b: 'Well-fed students learn better', t: 'Good meals help students focus and keep their energy up all day.', qs: '3 questions: menu planning, nutrition proof, healthy ingredients' },
    { b: 'Safe food protects your name', t: 'A well-run kitchen lowers risk and builds trust with every family.', qs: '3 questions: kitchen hygiene, allergens, continuous improvement' },
    { b: 'Families notice what you serve', t: 'Food is one of the first things parents and students judge an institution on.', qs: '3 questions: nutrition education, sustainability, communication' }
  ];
  function tour() {
    const DUR = 4500;
    const tabs = h('div', { className: 'tour-tabs', role: 'tablist' });
    const body = h('div', { className: 'tour-body', role: 'tabpanel' });
    const btns = Q.pillars.map((p, n) => { const b = h('button', { type: 'button', role: 'tab' }, [(n + 1) + ' · ' + (n === 2 ? 'Awareness' : p.name), h('i')]); b.style.setProperty('--dur', DUR + 'ms'); b.onclick = () => go(n, true); tabs.append(b); return b; });
    let k = 0;
    function go(n, manual) {
      k = n;
      btns.forEach((b, m) => b.setAttribute('aria-selected', String(m === n)));
      const r = REASONS[n];
      body.className = 'tour-body'; void body.offsetWidth; body.className = 'tour-body swap';
      body.replaceChildren(h('span', { className: 'k', textContent: Q.pillars[n].name + ' · ' + Q.pillars[n].place }), h('b', { textContent: r.b }), h('p', { textContent: r.t }), h('p', { className: 'qs', textContent: r.qs }));
      today.zoom(today.areaBox(n)); today.chip(n);
      setCaption(Q.pillars[n].name + ':', Q.pillars[n].place.toLowerCase());
      if (!RM) later(() => go((k + 1) % 3), manual ? DUR * 2 : DUR);
    }
    later(() => go(0), 500);
    return h('div', { className: 'tour' }, [tabs, body]);
  }

  /* why option 2: attract loop for an idle tablet at the stand */
  const ATTRACT = [
    ['Well-fed students learn better.', 'Good meals help students focus and keep their energy up all day.'],
    ['Safe food protects your name.', 'A well-run kitchen lowers risk and builds trust.'],
    ['Families notice what you serve.', 'Food is one of the first things people judge you on.'],
    ['How future-ready is your dining?', 'Answer 9 questions in about 60 seconds and see your cafeteria built from your answers.']
  ];
  function attract() {
    clearTimers(); onIntro = false;
    compareUI.hidden = true;
    answers.fill(null); lead = null;
    today.render(variantFor(role));
    today.reveal(() => 5, 0, false);
    today.chip(-1);
    const big = h('div', { className: 'big' }), sub = h('p', { className: 'sub' });
    const dots = h('div', { className: 'dots' }, ATTRACT.map(() => h('i')));
    const ov = h('button', { className: 'attract', type: 'button', ariaLabel: 'Start the dining readiness check' }, [
      h('span', { className: 'eb', textContent: 'Compass Group · Dining Readiness Index' }), big, sub,
      h('span', { className: 'cta', textContent: 'Tap to check your institution  →' }), dots
    ]);
    let n = 0;
    const tick = () => {
      const [b, s] = ATTRACT[n % ATTRACT.length];
      big.textContent = b; sub.textContent = s;
      big.className = 'big'; sub.className = 'sub'; void big.offsetWidth; big.className = 'big swap'; sub.className = 'sub swap';
      [...dots.children].forEach((d, m) => d.classList.toggle('on', m === n % ATTRACT.length));
      today.zoom(n % ATTRACT.length < 3 ? today.areaBox(n % ATTRACT.length) : FULL);
      n++; later(tick, 4200);
    };
    tick();
    ov.onclick = () => { ov.remove(); intro(); };
    document.body.append(ov);
    ov.focus({ preventScroll: true });
  }
  // back to the attract loop after 45 s of nobody touching the first screen
  let onIntro = false, idleT = 0;
  const resetIdle = () => { clearTimeout(idleT); if (WHY_MODE === '2') idleT = setTimeout(() => { if (onIntro && !document.querySelector('.attract')) attract(); }, 45000); };
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle, true));

  function question(i) {
    clearTimers(); onIntro = false;
    today.chip(-1);
    busy = false;
    const q = Q.questions[i], p = q.pillar;
    today.quiz(answers, i);
    today.zoom(today.areaBox(p));
    setCaption(Q.pillars[p].name + ':', Q.pillars[p].place.toLowerCase());
    progress(i);
    const rows = Q.shuffle(q.options).map((o, n) => {
      const row = h('div', { className: 'orow' + (answers[i] === o.key ? ' picked' : '') });
      row.style.animationDelay = (0.08 + n * 0.06) + 's';
      const b = h('button', { className: 'opt', type: 'button', textContent: o.headline });
      const tick = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      tick.setAttribute('class', 'tick'); tick.setAttribute('viewBox', '0 0 26 26'); tick.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', 'M7.5 13.5l3.6 3.6 7.4-8'); tick.append(path);
      b.prepend(tick);
      const detail = h('p', { className: 'detail', textContent: o.text, hidden: true, id: 'd' + i + o.key });
      const more = h('button', { className: 'more', type: 'button', textContent: 'Details' });
      more.setAttribute('aria-expanded', 'false'); more.setAttribute('aria-controls', detail.id);
      more.onclick = () => { const open = detail.hidden; detail.hidden = !open; more.setAttribute('aria-expanded', String(open)); more.textContent = open ? 'Hide' : 'Details'; };
      b.onclick = () => pick(i, o.key, row);
      row.append(b, more, detail);
      return row;
    });
    const back = h('button', { className: 'link', type: 'button', textContent: '← Back' });
    back.onclick = () => (i === 0 ? intro() : question(i - 1));
    show([
      h('div', { className: 'qhead' }, [h('span', { className: 'count', textContent: 'Question ' + (i + 1) + ' of ' + N }), back]),
      h('span', { className: 'pillar-tag', textContent: (p + 1) + ' · ' + Q.pillars[p].name + ' · ' + Q.questions[i].short }),
      h('h2', { textContent: q.text }),
      h('div', { className: 'opts', role: 'group', ariaLabel: 'Answers' }, rows),
      i === 0 ? h('p', { className: 'tip', textContent: 'Tap an answer to choose it. Tap Details to read more.' }) : h('span')
    ]);
  }

  function pick(i, key, row) {
    if (busy) return; busy = true;
    answers[i] = key;
    screen.querySelectorAll('.orow').forEach(o => o.classList.remove('picked'));
    row.classList.add('picked');
    today.quiz(answers, -2);
    progress(-1);
    const p = Q.questions[i].pillar;
    const endOfPillar = Q.pillars[p].q[2] === i;
    if (endOfPillar) {
      later(() => { today.flash(p); setCaption(Q.pillars[p].name, 'area complete'); }, 450);
      later(() => (i + 1 < N ? question(i + 1) : leadForm()), 1650);
    } else later(() => question(i + 1), 750);
  }

  function leadForm() {
    clearTimers();
    today.quiz(answers, -1);
    today.zoom(FULL);
    setCaption('Your cafeteria is sketched.', 'Add your details to see it in colour.');
    progress(-1);
    const f = h('form');
    const name = h('input', { required: true, autocomplete: 'name', name: 'name' });
    const email = h('input', { type: 'email', required: true, autocomplete: 'email', name: 'email' });
    const phone = h('input', { type: 'tel', required: true, autocomplete: 'tel', name: 'phone', pattern: '\\+?[0-9 ]{7,}', title: 'Please enter a valid phone number, for example +91 98765 43210' });
    const inst = h('input', { autocomplete: 'organization', name: 'institution' });
    const consent = h('input', { type: 'checkbox', required: true, style: 'width:auto;margin-top:3px' });
    f.append(
      h('label', {}, ['Name', name]), h('label', {}, ['Work email', email]), h('label', {}, ['Phone', phone]),
      h('label', {}, [h('span', {}, ['Institution ', h('span', { className: 'opt-tag', textContent: '(optional)' })]), inst]),
      h('label', { style: 'display:flex;gap:10px;font-weight:400;align-items:flex-start' }, [consent, h('span', { className: 'note', textContent: 'I agree to Compass Group sending me my scorecard and contacting me about it. (Placeholder consent text, to be confirmed.)' })]),
      h('div', {}, [h('button', { className: 'btn', type: 'submit', textContent: 'See my cafeteria' })])
    );
    f.onsubmit = e => { e.preventDefault(); if (!f.reportValidity()) return; lead = { name: name.value.trim(), email: email.value.trim(), phone: phone.value.trim(), institution: inst.value.trim(), role }; result(); };
    show([
      h('p', { className: 'eyebrow', textContent: 'All 9 answered' }),
      h('h2', { textContent: 'Where should we send your scorecard?' }),
      h('p', { className: 'lead', textContent: 'We will email your full scorecard. Your cafeteria appears in colour on the next screen.' }),
      f
    ]);
  }

  function result() {
    clearTimers();
    const t = Q.total(answers), st = Q.stage(t), si = Q.stageIndex(t);
    const mine = i => Q.level(i, answers[i]);
    // stage colour: red for Foundation through to green for Future-Ready
    screen.style.setProperty('--stage', ['#B03A2E', '#C8641E', '#B9831A', '#5E8F34', '#2F6B2C'][si]);
    today.setSign(lead.institution);
    today.zoom(FULL);
    later(() => today.reveal(mine, 280), 350);
    setCaption((lead.institution || 'Your') + (lead.institution ? '’s' : '') + ' cafeteria', 'today');
    legend();
    // future-ready view for the slider (built once the reveal has played)
    later(() => {
      future.render(today.variant); future.setSign(lead.institution); future.setVB(FULL); future.reveal(() => 5, 0, false);
      cmpRange.value = 100; futureSvg.style.clipPath = 'inset(0 0 0 100%)'; divider.style.left = '100%';
      compareUI.hidden = false;
      // glide the divider in to show it can be dragged
      const t0 = performance.now(); const glide = now => { const k = Math.min(1, (now - t0) / 900), v = 100 - 45 * (1 - Math.pow(1 - k, 3)); cmpRange.value = v; futureSvg.style.clipPath = `inset(0 0 0 ${v}%)`; divider.style.left = v + '%'; if (k < 1) requestAnimationFrame(glide); };
      RM ? (cmpRange.value = 55, cmpRange.dispatchEvent(new Event('input'))) : requestAnimationFrame(glide);
      setCaption('Drag the slider', 'to compare with a future-ready cafeteria.');
    }, 350 + 9 * 280 + 900);

    const big = h('b', { textContent: '0' });
    const rungs = Q.stages.map(s => h('div', { className: 'rung' }, [h('i'), s.name.replace(' Stage', '')]));
    const cards = Q.pillars.map((p, n) => { const sc = Q.pillarScore(answers, n), b = Q.band(sc);
      return h('div', { className: 'pcard ' + b.id }, [h('small', { textContent: p.name }), h('b', {}, [String(sc), h('span', { textContent: ' / 15' })]), h('em', { textContent: b.word })]); });
    const rec = Q.record(answers, lead);
    console.log('Backend record (prototype):', rec);
    const notes = h('textarea', { placeholder: 'Institution details, interests, follow-up…' });
    const saved = h('p', { className: 'note' });
    const nf = h('form', {}, [notes, h('div', {}, [h('button', { className: 'btn', type: 'submit', textContent: 'Save note', style: 'font-size:15px;padding:13px 20px' })]), saved]);
    nf.onsubmit = e => { e.preventDefault(); rec.sellerNote = notes.value.trim(); saved.textContent = 'Prototype: the note is added to the record below, not saved anywhere yet.'; pre.textContent = JSON.stringify(rec, null, 2); };
    const pre = h('pre', { textContent: JSON.stringify(rec, null, 2) });
    const next = h('button', { className: 'link next-guest', type: 'button', textContent: 'Start again for the next guest' });
    next.onclick = () => { answers.fill(null); lead = null; role = ''; intro(); };

    show([
      h('p', { className: 'eyebrow', textContent: (lead.institution ? lead.institution + '’s' : 'Your') + ' readiness score' }),
      h('div', { className: 'score' }, [big, h('span', { textContent: '/ 45' })]),
      h('h2', { className: 'stage-name', textContent: st.name }),
      h('div', { className: 'ladder' }, rungs),
      h('p', { className: 'desc', textContent: st.desc }),
      h('div', { className: 'pcards' }, cards),
      h('p', { className: 'gaps', textContent: Q.gaps(answers) }),
      h('p', { className: 'sent' }, [h('span', { textContent: 'Your full scorecard, with next steps for each area, will be emailed to ' + lead.email + '.' })]),
      h('details', {}, [h('summary', { textContent: 'Seller notes (for the Compass team)' }), nf]),
      h('details', {}, [h('summary', { textContent: 'Backend record (demo only, not shown to guests)' }), pre]),
      next
    ]);
    later(() => {
      Q.countUp(big, t, 1500);
      rungs.forEach((r, n) => later(() => { r.classList.toggle('reached', n < si); r.classList.toggle('here', n === si); }, 500 + n * 160));
    }, 400);
  }

  WHY_MODE === '2' ? attract() : intro();
  resetIdle();
})();
</script>
</body>
</html>
